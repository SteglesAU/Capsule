server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Interactive web build (expo export, baseUrl=/demo) — SPA fallback.
  # no-cache so a redeploy shows up on a normal reload (bundles are content-hashed,
  # so revalidation is a cheap 304 when unchanged).
  location /demo/ {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /demo/index.html;
  }
  location = /demo {
    return 301 /demo/;
  }

  # Static marketing page at root.
  location / {
    try_files $uri $uri/ =404;
  }
}
